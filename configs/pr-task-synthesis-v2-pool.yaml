# Euphoria pool for pr-task-synthesis-v2 (288 tasks x 3 rollouts = 864 attempts): daytona filled to its account quota + modal for the rest, SAME node shape on both
# (2 vCPU / 4 GiB, the shape the envs were built and verified in; task.toml asks for cpus=2, memory_mb=4096).
#   daytona 120  org quota is 250 CPU / 500 GiB / 2000 GB disk (usage endpoint, 2026-10-07 23:05: ~empty). 2 vCPU x 120 = 240 CPU, 4 GiB x 120 = 480 GiB, 10 GB x 120 = 1200 GB (Daytona rejects >10 GB per sandbox: "Disk request 16GB exceeds maximum allowed per sandbox (10GB)"):
#                the largest round count that fits all three caps. 125 is the CPU/RAM ceiling but leaves no headroom for orphans; the CPU/RAM ceiling (125) binds, not disk.
#   modal  800   Modal now allows 1000 concurrent (probe 2026-10-07: 1000 vm sandboxes, 2 vCPU / 4 GiB, all exec'd in 13 s); vm runtime. 120 + 800 = 920 >= 864 attempts, 80 spare for retries.
# builds the Dockerfile in each provider (no prebuilt images, none pushed).
total_spend_cap_usd: 2500               # same as ~/.cache/sandboxes/caps.json
sandbox_providers:
  - {base: /ansh/sandboxes/configs/daytona.yaml, overrides: {cpu: 2, memory_mb: 4096, disk_gb: 10, peak_concurrent_sandboxes: 120}}
  - name: modal
    cpu: 2
    memory_mb: 4096
    disk_gb: 20
    peak_concurrent_sandboxes: 800
    spend_cap_usd: 2500
    auto_delete_minutes: 180
    extra: {runtime: vm}
