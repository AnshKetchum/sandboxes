# GKE sandboxes (docs/gke.md): one pod per sandbox, on the node pool that runs its size most cheaply (gke_place). A harbor
# task's Dockerfile is built once per context by Cloud Build into Artifact Registry (gke_build) and deleted when unused; nodes are
# billed through the node meter (gke_meter). Credentials: a kubeconfig from `gcloud container clusters get-credentials`.
# Watchdog: `python -m sandboxes.gke_ops watch` (or the janitor). `gke_ops down` leaves nothing that bills; `gke_ops residue` checks.
sandbox_providers:
  - name: gke
    cpu: 1
    memory_mb: 4096
    disk_gb: 10                           # requested in full (guaranteed); extra.ephemeral_request_gb < disk_gb over-commits
    peak_concurrent_sandboxes: 1000       # the namespace ResourceQuota (scripts/gke/setup.sh) is the hard ceiling
    spend_cap_usd: 50                     # raise deliberately after the first live verification
    auto_delete_minutes: 240              # activeDeadlineSeconds: the kubelet kills the pod here even if every process of ours died
    extra:
      cpu_request: 1.0                    # whole CPUs, request == limit: pinned to its own core (static CPU manager), nproc = 1
      spot: prefer                        # prefer | only | never; on-demand pools are the fallback when no spot pool can grow
      ready_timeout_s: 1200

gke:
  project: agentic-rollouts               # env GKE_PROJECT / GKE_LOCATION / GKE_CLUSTER override these three
  location: us-central1-a                 # zonal control plane: GKE's free tier credits one zonal cluster's fee
  cluster: sandboxes
  zones: [us-central1-a, us-central1-b, us-central1-c, us-central1-f]   # where sandbox nodes may run (spot capacity varies)
  system_pool: default-pool               # kube-system: 1 node while up, 0 after `down`
  node_service_account: gke-sandbox-nodes@agentic-rollouts.iam.gserviceaccount.com
  max_pods_per_node: 256
  kubelet_config: {cpuManagerPolicy: static}   # sandbox pools: Guaranteed pods get exclusive cores (nproc = their vCPUs)
  idle_scale_down_min: 15                 # a sandbox pool with no pod of ours this long: resized to 0
  auto_down_min: 60                       # no pod of ours this long: `down` (system pool, images, uploads). 0: never
  auto_up: true                           # a sandbox start on a cluster that is down brings it up (about 2 min)
  orphan_pending_min: 30
  node_overhead: {cpu: 0.5, mem_gib: 1.5, pods: 12, image_cache_gib: 200}   # DaemonSets and task images, per node
  # The pool catalog. Placement picks, per sandbox size, the pool cheapest per sandbox that can still grow (room on a running
  # node first); pools sit at 0 nodes, free, until a sandbox needs one. `gke_ops pools plan|apply` makes the cluster match.
  # max_nodes is over all zones. Quotas in us-central1 on 2026-10-27: CPUS 200 (regional, all families), N2D 200, E2 72,
  # C3D 24, C4D 24. The C3D/C4D pools need a quota increase to run at all: enable them once it is granted.
  pools:
    - {name: c3d-180-spot, machine: c3d-standard-180, spot: true, disk_gb: 2200, max_nodes: 6, enabled: false}   # 174 x (1 vCPU, 4 GiB, 10 GB) a node; 1K for ~$13.7/h
    - {name: c3d-180-od, machine: c3d-standard-180, spot: false, disk_gb: 2200, max_nodes: 6, enabled: false}    # on-demand fallback, 1K for ~$51/h
    - {name: c4d-192-spot, machine: c4d-standard-192, spot: true, disk_gb: 2250, max_nodes: 6, enabled: false}
    - {name: n2d-96-spot, machine: n2d-standard-96, spot: true, disk_gb: 1250, max_nodes: 2}     # 91 a node; what quota allows today
    - {name: n2d-96-od, machine: n2d-standard-96, spot: false, disk_gb: 1250, max_nodes: 2}
    - {name: e2-32-spot, machine: e2-standard-32, spot: true, disk_gb: 600, max_nodes: 2}
  registry: us-central1-docker.pkg.dev/agentic-rollouts/envs    # built task images (ctx:<context digest>)
  build:
    bucket: agentic-rollouts-sandbox-builds   # Cloud Build source uploads; lifecycle rule deletes anything older than a day
    machine_type: E2_HIGHCPU_8
    usd_per_minute: 0.0156                # catalog: E2 $0.0016/vCPU-min + $0.00035/GiB-min (the 2,500 free minutes not counted)
    storage_gib_month: 0.10               # Artifact Registry (first 0.5 GiB free, not counted)
    timeout_s: 1800
    max_concurrent: 20                    # Cloud Build allows 30 concurrent builds per region by default
    image_ttl_h: 6                        # an image no pod runs, unused this long: deleted by the watchdog
    cleanup_days: 2                       # the repository's own cleanup policy: deletes any image older than this, regardless
    service_account: sandbox-builder@agentic-rollouts.iam.gserviceaccount.com

# Machine shapes and prices (node meter, pool placement): `python scripts/gke/prices.py --project agentic-rollouts --region
# us-central1 --pools --write` refills them from Compute Engine and the Cloud Billing Catalog (spot prices move up to daily).
# Last refreshed 2026-10-27.
